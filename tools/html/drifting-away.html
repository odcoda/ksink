<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drifting Away</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #0a1b2a;
      background: radial-gradient(circle at top, #f7fbff 0%, #dbe9f6 45%, #c0d8f0 100%);
      min-height: 100vh;
      overflow: hidden;
    }

    .scene {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.7), transparent 50%),
        radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.5), transparent 45%),
        radial-gradient(circle at 60% 80%, rgba(255, 255, 255, 0.4), transparent 50%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.7);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(16, 60, 100, 0.15);
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #2b4c6f;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #3e6083;
    }

    .composer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(560px, 90vw);
      display: flex;
      gap: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      padding: 12px 14px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(16, 60, 100, 0.18);
      backdrop-filter: blur(10px);
    }

    .composer input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);
      color: #1a2b3c;
    }

    .composer button {
      border: none;
      background: linear-gradient(135deg, #5ab0ff, #7c5cff);
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 14px rgba(70, 120, 200, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .composer button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 18px rgba(70, 120, 200, 0.35);
    }

    .composer button:active {
      transform: translateY(1px);
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.15) 55%, rgba(200, 230, 255, 0.35) 100%);
      box-shadow: 0 0 18px rgba(160, 210, 255, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      pointer-events: none;
    }

    .bubble::after {
      content: "";
      position: absolute;
      top: 10%;
      left: 18%;
      width: 28%;
      height: 20%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      filter: blur(1px);
    }

    .bubble-message {
      font-size: 12px;
      text-align: center;
      color: rgba(30, 60, 90, 0.85);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
      line-height: 1.2;
      word-break: break-word;
    }

    .pop {
      animation: pop 0.4s ease-out forwards;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <header>
      <h1>Drifting Away</h1>
      <p>Release a thought and watch it float.</p>
    </header>

    <form class="composer" id="composer">
      <input id="messageInput" type="text" maxlength="80" placeholder="Type a short message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");
    const bubbles = [];

    const randomBetween = (min, max) => Math.random() * (max - min) + min;

    function createBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const messageSpan = document.createElement("span");
      messageSpan.className = "bubble-message";
      messageSpan.textContent = message;

      bubble.appendChild(messageSpan);
      scene.appendChild(bubble);

      const size = randomBetween(60, 110);
      const startX = randomBetween(size * 0.6, window.innerWidth - size * 0.6);
      const startY = window.innerHeight + randomBetween(20, 80);

      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;

      const duration = randomBetween(8.5, 12.5) * 1000;
      const popHeight = randomBetween(0.1, 0.35) * window.innerHeight;
      const drift = randomBetween(-12, 12);
      const wobbleRate = randomBetween(0.8, 1.8);
      const wobbleSize = randomBetween(6, 14);
      const riseSpeed = randomBetween(18, 32);
      const startTime = performance.now();

      bubbles.push({
        element: bubble,
        messageSpan,
        size,
        startX,
        startY,
        y: startY,
        drift,
        wobbleRate,
        wobbleSize,
        riseSpeed,
        startTime,
        duration,
        popHeight,
        popped: false
      });
    }

    function updateBubbles(time) {
      bubbles.forEach((bubble, index) => {
        if (bubble.popped) {
          return;
        }

        const elapsed = time - bubble.startTime;
        const progress = Math.min(elapsed / bubble.duration, 1);
        const driftX = bubble.drift * progress + Math.sin(elapsed / 1000 * bubble.wobbleRate) * bubble.wobbleSize;
        bubble.y -= bubble.riseSpeed * (1 + progress * 1.2);

        const opacity = Math.max(0, 0.9 - progress * 0.9);
        bubble.element.style.opacity = opacity;
        bubble.messageSpan.style.opacity = Math.max(0, 1 - progress * 1.1);

        const shape = 1 + Math.sin(elapsed / 1000 * bubble.wobbleRate) * 0.04;
        bubble.element.style.transform = `translate(${bubble.startX + driftX}px, ${bubble.y}px) scale(${shape}, ${2 - shape})`;

        const shouldPop = bubble.y <= bubble.popHeight || progress >= 1;
        if (shouldPop) {
          bubble.popped = true;
          bubble.element.classList.add("pop");
          setTimeout(() => {
            bubble.element.remove();
            bubbles.splice(index, 1);
          }, 400);
        }
      });

      requestAnimationFrame(updateBubbles);
    }

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message) {
        return;
      }
      createBubble(message);
      messageInput.value = "";
      messageInput.focus();
    });

    requestAnimationFrame(updateBubbles);
  </script>
</body>
</html>
